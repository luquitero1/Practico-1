<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | E-Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/front/dist/css/dashboard.css">
</head>
<body class="dash-body" style="visibility: hidden;">
    <div class="row g-0">

        <aside class="dash-sidebar col-12 col-lg-2 p-3">
            <h2 class="h5 text-warning mb-3">E-Book Admin</h2>
            <nav class="nav nav-pills flex-lg-column">
                <a class="nav-link active" href="#books">Books</a>
                <a class="nav-link" href="/front/">Public site</a>
                <a class="nav-link" href="#" onclick="cerrarSesion()">Log out</a>
            </nav>
        </aside>

        <div class="col-12 col-lg-10">

            <header class="d-flex flex-wrap justify-content-between align-items-center gap-2 bg-white border-bottom p-3">
                <h1 class="h4 m-0">Admin Dashboard</h1>
                <div class="d-flex align-items-center gap-3">
                    <span><strong id="nombre"></strong> (<span id="rol"></span>)</span>
                    <button type="button" class="btn btn-dark btn-sm" onclick="cerrarSesion()">Log out</button>
                </div>
            </header>

            <main class="p-3">
                <section id="books" class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h2 class="h5">Books management</h2>
                        <p class="text-muted m-0">Adding, editing and deleting books will be available here soon.</p>
                    </div>
                </section>
            </main>

        </div>
    </div>

    <script src="/front/js/auth.js"></script>
    <script>protegerPagina(ROL_ADMIN);</script>
</body>
</html>
