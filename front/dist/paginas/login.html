<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | E-Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/front/dist/css/auth.css">
</head>
<body class="auth-body d-flex align-items-center justify-content-center p-3">

    <main class="card auth-card shadow w-100 p-4">
        <h1 class="h2 text-center mb-4">Log in to E-Book</h1>

        <form id="loginForm">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control mb-3" id="email" name="email" required>

            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control mb-3" id="password" name="password" required>

            <p id="loginError" class="text-danger"></p>

            <button type="submit" class="btn btn-auth rounded-pill w-100">Log in</button>
        </form>

        <a href="/" class="text-center text-dark mt-3">Back to home</a>
    </main>

    <script src="/front/js/auth.js"></script>
    <script src="/front/js/login.js"></script>
</body>
</html>
